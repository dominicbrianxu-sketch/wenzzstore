<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Admin WENZZSTORE</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f3f6fb;color:#17233c;font:15px Arial,sans-serif}.wrap{max-width:950px;margin:24px auto;padding:0 16px}h1{color:#9A3412;font-size:24px}.panel,.order{background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:18px;margin:12px 0}input,button,select{font:inherit;padding:12px;border-radius:10px;border:1px solid #cbd5e1}input{width:100%;margin:7px 0 12px}button{background:#EA580C;color:#fff;border:0;font-weight:bold;cursor:pointer}button:disabled{opacity:.6}.tag{display:inline-block;padding:4px 10px;border-radius:18px;font-size:12px;font-weight:bold;background:#FFF7ED;color:#9A3412}.PAID{background:#DCFCE7;color:#166534}.FAILED,.PAYMENT_CREATION_FAILED{background:#FEE2E2;color:#991B1B}.AWAITING_PAYMENT{background:#FEF9C3;color:#854D0E}.muted{color:#64748b}.error{color:#b42318}a{color:#EA580C;overflow-wrap:anywhere}.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}h3{margin:8px 0}</style></head><body><main class="wrap">
<h1>WENZZSTORE — Admin Pesanan</h1>
<p class="muted">Pembelian berjalan otomatis lewat iPaymu. Halaman ini hanya untuk memantau pesanan yang sudah dibayar dan memproses pengiriman produk.</p>
<section class="panel"><label>ADMIN TOKEN</label><input id="token" type="password" placeholder="Masukkan token admin Cloudflare" autocomplete="off">
<div class="actions"><button id="login">Masuk / Muat Pesanan</button><select id="filter"><option value="">Semua status</option><option value="PAID">Sudah dibayar</option><option value="AWAITING_PAYMENT">Menunggu pembayaran</option><option value="PAYMENT_CREATION_FAILED">Gagal buat tagihan</option><option value="FAILED">Gagal/kedaluwarsa</option></select></div><p id="msg" aria-live="polite"></p></section>
<div id="orders"></div><div class="actions"><button id="more" hidden>Muat lebih banyak</button></div></main>
<script>
const $=id=>document.getElementById(id),token=()=>$('token').value.trim(),box=$('orders'),msg=$('msg');
let cursor=null,all=[];
const rupiah=n=>new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(n||0);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LABEL={PAID:'SUDAH DIBAYAR',AWAITING_PAYMENT:'MENUNGGU PEMBAYARAN',PAYMENT_CREATION_FAILED:'GAGAL BUAT TAGIHAN',CREATING_PAYMENT:'MEMBUAT TAGIHAN',FAILED:'GAGAL / KEDALUWARSA'};
async function api(url,opt={}){const r=await fetch(url,{...opt,headers:{...(opt.headers||{}),Authorization:`Bearer ${token()}`}});const t=await r.text();let d;try{d=JSON.parse(t)}catch{throw Error('Server tidak membalas JSON (HTTP '+r.status+'). Pastikan folder functions ter-deploy.')}if(!r.ok)throw Error(d.error||'Gagal');return d}
function render(){box.innerHTML='';const f=$('filter').value;const list=all.filter(o=>!f||o.status===f);if(!list.length)box.innerHTML='<p class="muted">Tidak ada pesanan.</p>';
for(const o of list){const el=document.createElement('section');el.className='order';
const wa=`https://wa.me/${String(o.phone||'').replace(/\D/g,'').replace(/^0/,'62')}?text=${encodeURIComponent(`Halo ${o.name}, pembayaran pesanan WENZZSTORE ${o.orderId} (${o.product}) sudah kami terima. Pesanan sedang diproses.`)}`;
el.innerHTML=`<span class="tag ${esc(o.status)}">${esc(LABEL[o.status]||o.status)}</span><h3>${esc(o.product)} — ${esc(o.packageLabel||o.duration||'')} × ${esc(o.qty)}</h3>
<p><b>Total:</b> ${rupiah(o.total)} <span class="muted">(${rupiah(o.unitPrice)}/item)</span><br><b>Jenis akses:</b> ${esc(o.accessTypeRequested||'-')}<br><b>Referensi:</b> ${esc(o.orderId)}<br><b>Nama:</b> ${esc(o.name)}<br><b>WhatsApp:</b> ${esc(o.phone)}<br><b>Email:</b> ${esc(o.email)}<br><b>Dibuat:</b> ${esc(o.createdAt||'-')}${o.paidAt?`<br><b>Dibayar:</b> ${esc(o.paidAt)} ${o.paymentChannel?'via '+esc(o.paymentChannel):''}`:''}${o.paymentError?`<br><span class="error">Error: ${esc(o.paymentError)}</span>`:''}</p>
<div class="actions">${o.status==='PAID'?`<a href="${esc(wa)}" target="_blank" rel="noopener">Hubungi pembeli via WhatsApp</a>`:''}${o.paymentUrl&&o.status==='AWAITING_PAYMENT'?`<a href="${esc(o.paymentUrl)}" target="_blank" rel="noopener">Link pembayaran</a>`:''}${['PAYMENT_CREATION_FAILED','CREATING_PAYMENT'].includes(o.status)?'<button class="retry">Buat ulang tagihan</button>':''}</div><p class="result muted"></p>`;
const b=el.querySelector('.retry');if(b)b.onclick=async()=>{const r=el.querySelector('.result');b.disabled=true;r.textContent='Membuat tagihan...';try{const d=await api('/api/admin/confirm',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({referenceId:o.orderId})});r.innerHTML=`Berhasil. <a href="${esc(d.paymentUrl)}" target="_blank" rel="noopener">Buka link</a>`;await load(true)}catch(e){r.className='result error';r.textContent=e.message;b.disabled=false}};
box.appendChild(el)}}
async function load(reset){if(!token()){msg.textContent='Masukkan token admin.';return}msg.className='muted';msg.textContent='Memuat...';try{if(reset){cursor=null;all=[]}const d=await api('/api/admin/orders'+(cursor?'?cursor='+encodeURIComponent(cursor):''));all=all.concat(d.orders);cursor=d.cursor;$('more').hidden=!d.hasMore;render();msg.textContent=`Dimuat ${all.length} pesanan.`}catch(e){msg.className='error';msg.textContent=e.message}}
$('login').onclick=()=>load(true);$('more').onclick=()=>load(false);$('filter').onchange=render;
</script></body></html>
