<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin WENZZSTORE</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f6fb;color:#17233c;font:15px Arial}.wrap{max-width:950px;margin:30px auto;padding:0 16px}h1{color:#9A3412}.panel,.order{background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:20px;margin:14px 0}input,button{font:inherit;padding:12px;border-radius:10px;border:1px solid #cbd5e1}input{width:100%;margin:7px 0 12px}button{background:#EA580C;color:white;border:0;font-weight:bold;cursor:pointer}.tag{display:inline-block;background:#FFF7ED;color:#9A3412;padding:5px 9px;border-radius:18px;font-size:12px}.muted{color:#64748b}.error{color:#b42318}a{color:#EA580C;overflow-wrap:anywhere}.actions{display:flex;gap:10px;flex-wrap:wrap}</style></head><body><main class="wrap"><h1>WENZZSTORE — Admin Pesanan</h1><p class="muted">Periksa pesanan, tetapkan harga final, lalu buat tagihan iPaymu.</p><section class="panel"><label>ADMIN TOKEN</label><input id="token" type="password" placeholder="Masukkan token admin Cloudflare"><div class="actions"><button id="login">Masuk / Muat Pesanan</button><button id="refresh">Refresh</button></div><p id="msg" aria-live="polite"></p></section><div id="orders"></div></main><script>
const token=()=>document.getElementById('token').value.trim(),box=document.getElementById('orders'),msg=document.getElementById('msg');function rupiah(n){return new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(n)}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function load(){if(!token()){msg.textContent='Masukkan token admin.';return}msg.textContent='Memuat...';try{const r=await fetch('/api/admin/orders',{headers:{Authorization:`Bearer ${token()}`}}),d=await r.json();if(!r.ok)throw Error(d.error||'Gagal memuat');box.innerHTML='';if(!d.orders.length)box.textContent='Belum ada pesanan.';for(const o of d.orders){const el=document.createElement('section');el.className='order';el.innerHTML=`<span class="tag">${esc(o.status)}</span><h3>${esc(o.product)} — ${esc(o.duration||'Durasi belum dicatat')} × ${o.qty}</h3><p><b>Jenis akses diminta:</b> ${esc(o.accessTypeRequested||'-')}</p><p><b>Referensi:</b> ${esc(o.orderId)}<br><b>Nama:</b> ${esc(o.name)}<br><b>WhatsApp:</b> ${esc(o.phone)}<br><b>Email:</b> ${esc(o.email)}</p><p>Harga mulai/item: ${o.startingPrice?rupiah(o.startingPrice):(o.unitPrice===null?'Belum ditetapkan':rupiah(o.unitPrice))}<br>Total referensi: ${o.unitPrice===null?'Belum ditetapkan':rupiah(o.unitPrice*o.qty)}<br><small>Harga final ditetapkan admin setelah memeriksa jenis akses, durasi, dan stok.</small></p>${o.status==='WAITING_ADMIN'?`<label>Harga final per item (Rp)</label><input class="price" type="number" min="1000" step="1000" value="${o.unitPrice??''}"><button class="confirm">Konfirmasi & Buat Tagihan iPaymu</button><p class="result"></p>`:''}${o.paymentUrl?`<p><b>Link pembayaran:</b><br><a href="${esc(o.paymentUrl)}" target="_blank" rel="noopener">${esc(o.paymentUrl)}</a></p><button class="copy">Salin link</button> <a class="send" target="_blank" rel="noopener">Kirim ke WhatsApp pelanggan</a>`:''}`;box.appendChild(el);if(o.status==='WAITING_ADMIN')el.querySelector('.confirm').onclick=async()=>{const btn=el.querySelector('.confirm'),result=el.querySelector('.result');btn.disabled=true;result.textContent='Membuat tagihan...';try{const rr=await fetch('/api/admin/confirm',{method:'POST',headers:{'Content-Type':'application/json',Authorization:`Bearer ${token()}`},body:JSON.stringify({referenceId:o.orderId,finalPrice:Number(el.querySelector('.price').value)})}),dd=await rr.json();if(!rr.ok)throw Error(dd.error||'Gagal');result.innerHTML=`Tagihan berhasil dibuat: <a href="${esc(dd.paymentUrl)}" target="_blank">Buka link</a>`;await load()}catch(e){result.textContent=e.message;btn.disabled=false}};if(o.paymentUrl){el.querySelector('.copy').onclick=()=>navigator.clipboard.writeText(o.paymentUrl);const text=`Halo ${o.name}, pesanan WENZZSTORE ${o.orderId} telah dikonfirmasi. Total ${rupiah(o.total)}. Silakan bayar melalui ${o.paymentUrl}`;el.querySelector('.send').href=`https://wa.me/${o.phone.replace(/\\D/g,'')}?text=${encodeURIComponent(text)}`}}msg.textContent=`Berhasil memuat ${d.orders.length} pesanan.`}catch(e){msg.textContent=e.message;msg.className='error'}}document.getElementById('login').onclick=load;document.getElementById('refresh').onclick=load;
</script></body></html>
