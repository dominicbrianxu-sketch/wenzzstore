<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#F97316"><title>Status Pesanan — WENZZSTORE</title><style>body{font-family:Arial,sans-serif;background:#f5f7fb;color:#172033;margin:0;min-height:100vh;display:grid;place-items:center;padding:20px}.card{background:#fff;width:min(100%,520px);padding:32px;border-radius:20px;box-shadow:0 12px 40px #152b5518;text-align:center}h1{color:#F97316}p{line-height:1.7;color:#536071}strong{color:#14295b}.btn{display:inline-block;background:#F97316;color:white;text-decoration:none;padding:13px 22px;border-radius:12px;font-weight:bold;margin-top:14px}</style></head><body><main class="card"><h1>WENZZSTORE</h1><h2 id="heading">Memeriksa status pesanan…</h2><p id="detail">Mohon tunggu sebentar.</p><p id="reference"></p><a class="btn" href="/">Kembali ke website</a></main><script>const params=new URLSearchParams(location.search),ref=params.get('ref');const heading=document.getElementById('heading'),detail=document.getElementById('detail');if(params.get('cancel')){heading.textContent='Pembayaran dibatalkan';detail.textContent='Pesanan belum dibayar. Kamu dapat kembali ke website dan membuat pesanan baru.'}else if(!ref){heading.textContent='Referensi tidak ditemukan';detail.textContent='Silakan hubungi admin jika kamu sudah melakukan pembayaran.'}else{document.getElementById('reference').textContent='Referensi: '+ref;fetch('/api/order-status?ref='+encodeURIComponent(ref)).then(r=>r.json()).then(d=>{if(d.error)throw Error(d.error);heading.textContent=d.status==='PAID'?'Pembayaran berhasil':'Pembayaran sedang menunggu';detail.textContent=d.status==='PAID'?'Pembayaran kamu sudah terverifikasi. Admin akan memproses pesanan.':'Jika kamu sudah membayar, tunggu beberapa saat lalu muat ulang halaman ini. Status akan berubah setelah notifikasi resmi iPaymu diterima.'}).catch(()=>{heading.textContent='Status belum tersedia';detail.textContent='Simpan nomor referensi dan hubungi admin jika pembayaran sudah dilakukan.'})}</script></body></html>
