<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#F97316"><title>Status Pesanan — WENZZSTORE</title>
<style>body{font-family:Arial,sans-serif;background:#f5f7fb;color:#172033;margin:0;min-height:100vh;display:grid;place-items:center;padding:20px}.card{background:#fff;width:min(100%,520px);padding:32px;border-radius:20px;box-shadow:0 12px 40px #152b5518;text-align:center}h1{color:#F97316;margin:0 0 6px}p{line-height:1.7;color:#536071}.btn{display:inline-block;background:#F97316;color:#fff;text-decoration:none;padding:13px 22px;border-radius:12px;font-weight:bold;margin:6px}.ghost{background:#fff;color:#F97316;border:2px solid #F97316}#ref{font-size:13px;word-break:break-all}</style></head><body><main class="card"><h1>WENZZSTORE</h1><h2 id="heading">Memeriksa status pesanan…</h2><p id="detail">Mohon tunggu sebentar.</p><p id="ref"></p><div id="actions"><a class="btn" href="/">Kembali ke website</a></div></main>
<script>
const params=new URLSearchParams(location.search),ref=params.get('ref');
const H=document.getElementById('heading'),D=document.getElementById('detail');
const set=(h,d)=>{H.textContent=h;D.textContent=d};
const WA='https://wa.me/6281315509337';
let tries=0;
function show(st){
 if(st==='PAID')return set('Pembayaran berhasil ✅','Pembayaran kamu sudah terverifikasi. Admin akan memproses pesananmu dan menghubungi lewat WhatsApp/email.'),true;
 if(st==='FAILED')return set('Pembayaran gagal atau kedaluwarsa','Pesanan ini tidak dapat dibayar lagi. Silakan buat pesanan baru dari website.'),true;
 if(st==='PAYMENT_CREATION_FAILED'||st==='CREATING_PAYMENT')return set('Tagihan belum berhasil dibuat','Terjadi kendala saat membuat tagihan. Silakan buat pesanan baru atau hubungi admin dengan menyertakan nomor referensi.'),true;
 set('Menunggu pembayaran','Jika kamu sudah membayar, halaman ini diperbarui otomatis setelah notifikasi resmi iPaymu diterima.');return false}
async function check(){
 try{const r=await fetch('/api/order-status?ref='+encodeURIComponent(ref),{cache:'no-store'});const t=await r.text();let d;try{d=JSON.parse(t)}catch{throw Error('bad')}
  if(d.error)throw Error(d.error);if(show(d.status))return;
 }catch(e){set('Status belum tersedia','Simpan nomor referensi dan hubungi admin jika pembayaran sudah dilakukan.');return}
 if(++tries<24)setTimeout(check,5000)}
if(params.get('cancel')){set('Pembayaran dibatalkan','Pesanan belum dibayar. Kamu dapat kembali ke website dan membuat pesanan baru.')}
else if(!ref){set('Referensi tidak ditemukan','Silakan hubungi admin jika kamu sudah melakukan pembayaran.')}
else{document.getElementById('ref').textContent='Referensi: '+ref;check()}
if(ref)document.getElementById('actions').insertAdjacentHTML('beforeend','<a class="btn ghost" target="_blank" rel="noopener" href="'+WA+'?text='+encodeURIComponent('Halo admin, saya ingin menanyakan pesanan '+ref)+'">Hubungi admin</a>');
</script></body></html>
