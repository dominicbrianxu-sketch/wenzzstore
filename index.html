function waLink(product) {
  const msg = product
    ? `Halo Admin Wenz Store, saya ingin bertanya tentang ${product}.`
    : 'Halo Admin Wenz Store, saya ingin bertanya tentang produk dan paket yang tersedia.';

  return `https://wa.me/${phone}?text=${encodeURIComponent(msg)}`;
}

const modal = document.getElementById('checkoutModal');
const form = document.getElementById('checkoutForm');
const qtyInput = form.elements.qty;
const errorBox = document.getElementById('checkoutError');
const accessSelect = form.elements.accessType;
const packageOptions = document.getElementById('packageOptions');

document.getElementById('waContact').href = waLink();

let selectedProduct = '';
let selectedPackage = null;

function money(n) {
  return new Intl.NumberFormat('id-ID', {
    style: 'currency',
    currency: 'IDR',
    maximumFractionDigits: 0
  }).format(n);
}

function updateTotal() {
  const qty = Math.max(1, Number(qtyInput.value) || 1);

  if (!selectedPackage) {
    document.getElementById('checkoutTotal').textContent = 'Pilih paket';
    return;
  }

  document.getElementById('checkoutTotal').textContent =
    money(selectedPackage.price * qty);
}

function renderPackages(product) {
  packageOptions.innerHTML = '';
  selectedPackage = null;

  product.packages
    .filter(item =>
      Number.isSafeInteger(item[2]) && item[2] >= 1000
    )
    .forEach(item => {
      const [label, duration, price] = item;

      const wrapper = document.createElement('label');
      wrapper.className = 'package-option';

      const radio = document.createElement('input');
      radio.type = 'radio';
      radio.name = 'packageChoice';
      radio.value = label;
      radio.required = true;

      const span = document.createElement('span');
      const strong = document.createElement('strong');
      strong.textContent = label;

      const small = document.createElement('small');
      small.textContent =
        money(price) + (duration ? ' · ' + duration : '');

      span.append(strong, small);
      wrapper.append(radio, span);

      radio.addEventListener('change', () => {
        selectedPackage = { label, duration, price };
        updateTotal();
      });

      packageOptions.append(wrapper);
    });
}

document.querySelectorAll('[data-product]').forEach(link => {
  link.addEventListener('click', event => {
    event.preventDefault();

    selectedProduct = link.dataset.product;
    const product = catalog[selectedProduct];

    if (!product) {
      window.open(waLink(selectedProduct), '_blank', 'noopener');
      return;
    }

    document.getElementById('checkoutProductLabel').textContent =
      `${selectedProduct} — mulai ${money(product.start)}`;

    form.reset();
    renderPackages(product);
    qtyInput.value = 1;
    errorBox.textContent = '';

    document.getElementById('accessHelp').textContent =
      product.note +
      ' Harga yang ditampilkan berlaku untuk paket yang dipilih. ' +
      'Pastikan jenis akses sesuai kebutuhan.';

    updateTotal();
    modal.hidden = false;
    form.elements.name.focus();
  });
});

qtyInput.addEventListener('input', updateTotal);

document.getElementById('checkoutClose').addEventListener('click', () => {
  modal.hidden = true;
});

modal.addEventListener('click', event => {
  if (event.target === modal) {
    modal.hidden = true;
  }
});

/* =========================================
   CHECKOUT IPAYMU
   ========================================= */

form.addEventListener('submit', async event => {
  event.preventDefault();

  if (
    !selectedPackage ||
    !Number.isSafeInteger(selectedPackage.price) ||
    selectedPackage.price < 1000
  ) {
    errorBox.textContent = 'Pilih paket dengan harga yang tersedia.';
    return;
  }

  const button = document.getElementById('payButton');

  button.disabled = true;
  button.textContent = 'Membuat pembayaran iPaymu...';
  errorBox.textContent = '';

  try {
    const payload = {
      product: selectedProduct,
      packageLabel: selectedPackage.label,
      duration: selectedPackage.duration,
      packagePrice: selectedPackage.price,
      accessType: accessSelect.value,
      qty: Number(qtyInput.value),
      name: form.elements.name.value.trim(),
      phone: form.elements.phone.value.trim(),
      email: form.elements.email.value.trim()
    };

    const response = await fetch('/api/create-order', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Accept': 'application/json'
      },
      body: JSON.stringify(payload)
    });

    /* Baca respons sebagai teks terlebih dahulu */
    const rawResponse = await response.text();

    let data;

    try {
      data = JSON.parse(rawResponse);
    } catch (parseError) {
      const preview = rawResponse
        .replace(/<[^>]*>/g, ' ')
        .replace(/\s+/g, ' ')
        .trim()
        .slice(0, 300);

      throw new Error(
        `Server mengirim respons bukan JSON. HTTP ${response.status}. ` +
        `Isi respons: ${preview || 'Kosong'}`
      );
    }

    if (!response.ok || data.ok === false) {
      throw new Error(
        data.message ||
        data.error ||
        `Permintaan gagal. HTTP ${response.status}`
      );
    }

    if (
      !data.paymentUrl ||
      !/^https:\/\//i.test(data.paymentUrl)
    ) {
      throw new Error(
        'Link pembayaran iPaymu tidak diterima dari server.'
      );
    }

    /* Arahkan pelanggan ke halaman pembayaran */
    window.location.assign(data.paymentUrl);

  } catch (error) {
    console.error('WENZZSTORE CHECKOUT ERROR:', error);

    errorBox.textContent =
      error.message ||
      'Terjadi kesalahan. Coba lagi atau hubungi admin.';

    button.disabled = false;
    button.textContent = 'Bayar Sekarang';
  }
});

const menu = document.getElementById('menu');

document.getElementById('menuBtn').addEventListener('click', () => {
  menu.classList.toggle('open');
});

menu.querySelectorAll('a').forEach(link => {
  link.addEventListener('click', () => {
    menu.classList.remove('open');
  });
});

/* =========================================
   DARK MODE
   ========================================= */

const themeBtn = document.getElementById('themeBtn');

themeBtn.addEventListener('click', () => {
  document.body.classList.toggle('dark');

  localStorage.setItem(
    'wenz-theme',
    document.body.classList.contains('dark') ? 'dark' : 'light'
  );
});

if (localStorage.getItem('wenz-theme') === 'dark') {
  document.body.classList.add('dark');
}
