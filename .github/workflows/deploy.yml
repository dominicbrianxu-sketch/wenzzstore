
name: Deploy WENZZSTORE to Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Extract website package
        run: |
          mkdir -p dist
          unzip -o WENZZSTORE-WEBSITE-DEPLOY.zip -d dist

      - name: Verify Pages Functions
        run: |
          test -f dist/functions/api/create-order.js
          test -f dist/functions/api/admin/orders.js
          test -f dist/functions/api/ipaymu/callback.js
          echo "Functions structure OK"

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler@latest pages deploy dist \
            --project-name=wenzzstoree \
            --branch=main
