
name: Deploy WENZZSTORE to Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Extract website package
        run: |
          rm -rf package dist functions
          mkdir -p package dist

          unzip -o WENZZSTORE-WEBSITE-DEPLOY.zip -d package

          cp -a package/. dist/

          if [ ! -d package/functions ]; then
            echo "ERROR: Folder functions tidak ditemukan dalam ZIP"
            exit 1
          fi

          cp -a package/functions ./functions

          rm -rf dist/functions
          rm -f dist/wrangler.toml
          rm -f wrangler.toml

      - name: Verify Pages Functions
        run: |
          test -f functions/api/create-order.js
          test -f functions/api/admin/orders.js
          test -f functions/api/ipaymu/callback.js
          echo "Functions structure OK"

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler@4 pages deploy dist \
            --project-name=wenzzstoree \
            --branch=main
